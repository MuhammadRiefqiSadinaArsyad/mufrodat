<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Mufradat — Media Pembelajaran Kosakata Bahasa Arab untuk Pemula</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap">
<style>
:root {
  --bg: #DCE7DF;
  --bg-app: #F4F7F5;
  --card: #FFFFFF;
  --card-soft: #EDF3EF;
  --forest: #124538;
  --forest-2: #1B5B4B;
  --sage-banner: linear-gradient(135deg, #4F7867 0%, #2E5646 100%);
  --mosque-sky: linear-gradient(180deg, #B5BEB4 0%, #CEC8B8 62%, #B8B2A2 100%);
  --gold: #D4A359;
  --gold-text: #8A5F17;
  --gold-soft: #FBF4E6;
  --ink: #122923;
  --mut: #5D746C;
  --line: #DCE6E0;
  --line-soft: #E7EFEA;
  --ok: #E1F4EA;
  --okc: #0F6846;
  --bad: #FCE8EC;
  --badc: #A62639;
  --q-c0: #C85A70;
  --q-c1: #B86B43;
  --q-c2: #5B8C42;
  --q-c3: #B7791F;
  --shadow-sm: 0 6px 20px rgba(18, 69, 56, 0.06);
  --shadow-md: 0 14px 34px rgba(18, 69, 56, 0.10);
  --ar: 'Scheherazade New', 'Amiri', 'Traditional Arabic', serif;
  --ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #07120F;
  --bg-app: #0B1B17;
  --card: #122822;
  --card-soft: #17332B;
  --forest: #1F7A63;
  --forest-2: #2A9078;
  --sage-banner: linear-gradient(135deg, #1E4D3F 0%, #13352B 100%);
  --mosque-sky: linear-gradient(180deg, #0F2620 0%, #18362E 62%, #1E3F35 100%);
  --gold: #E2B56B;
  --gold-text: #E2B56B;
  --gold-soft: rgba(226, 181, 107, 0.14);
  --ink: #EAF4F0;
  --mut: #8FA9A0;
  --line: #2B4F44;
  --line-soft: #19322B;
  --ok: #103528;
  --okc: #7CE0B3;
  --bad: #3B1720;
  --badc: #FFA3B3;
  --q-c0: #F08CA0;
  --q-c1: #E89B72;
  --q-c2: #88C46A;
  --q-c3: #F0BC5E;
  --shadow-sm: 0 6px 20px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 16px 38px rgba(0, 0, 0, 0.42);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 15px/1.6 var(--ui);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.35s ease, color 0.3s ease;
}

h1, h2, h3, h4 {
  margin: 0;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

p { margin: 0 0 0.6em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

svg.ic {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
}

svg.ic-lg { width: 22px; height: 22px; }

/* ===== Kerangka Aplikasi (App Shell) ===== */
.app-shell {
  max-width: 960px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg-app);
  box-shadow: 0 0 60px rgba(18, 41, 35, 0.12);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ===== Animasi Masuk & Transisi Langit Siang/Malam ===== */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes spinSlow {
  to { transform: rotate(360deg); }
}

@keyframes skyRise {
  0% { transform: translateY(26px) scale(0.8) rotate(-20deg); opacity: 0; }
  60% { transform: translateY(-4px) scale(1.05) rotate(4deg); opacity: 1; }
  100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
}

.view-enter {
  animation: fadeSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.sky-overlay {
  position: fixed;
  inset: 0;
  z-index: 600;
  pointer-events: none !important;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s ease, visibility 0.35s ease;
}

.sky-overlay.active {
  opacity: 1;
  visibility: visible;
}

.sky-backdrop {
  position: absolute;
  inset: 0;
  pointer-events: none !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.sky-overlay.to-dark .sky-backdrop { background: rgba(7, 18, 15, 0.82); }
.sky-overlay.to-light .sky-backdrop { background: rgba(244, 247, 245, 0.82); }

.sky-stage {
  position: relative;
  z-index: 2;
  pointer-events: none !important;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.sky-disc {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--gold);
  color: var(--gold);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-md);
  animation: skyRise 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.sky-title {
  margin-top: 12px;
  font-weight: 800;
  font-size: 0.96rem;
  color: var(--ink);
}

.sky-sub {
  font-family: var(--ar);
  font-size: 1.45rem;
  color: var(--gold-text);
  line-height: 1.2;
}

/* ===== Loading Screen Bahasa Arab ("أَهْلًا وَسَهْلًا") ===== */
.splash {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--card);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

.splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none !important;
}

.splash-mandala {
  position: absolute;
  width: 460px;
  height: 460px;
  color: var(--forest);
  opacity: 0.05;
  animation: spinSlow 60s linear infinite;
  pointer-events: none;
}

.splash-box {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 390px;
  text-align: center;
  padding: 28px 22px;
}

.splash-logo-pill {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: var(--forest);
  color: #FFFFFF;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  box-shadow: 0 12px 26px rgba(18, 69, 56, 0.24);
}

.splash-brand-title {
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-bottom: 4px;
}

.splash-ar {
  font-family: var(--ar);
  font-size: 3.3rem;
  font-weight: 700;
  color: var(--forest);
  line-height: 1.25;
  direction: rtl;
  margin: 6px 0 2px;
}

[data-theme="dark"] .splash-ar { color: var(--gold); }

.splash-id {
  font-size: 0.9rem;
  color: var(--mut);
  font-weight: 600;
  margin-bottom: 22px;
}

.splash-word-card {
  background: var(--bg-app);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 16px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
}

.splash-word-card small {
  display: block;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mut);
  font-weight: 700;
}

.splash-word-card strong {
  display: block;
  font-size: 0.92rem;
  color: var(--ink);
}

.splash-word-card span {
  font-size: 0.78rem;
  color: var(--gold-text);
  font-weight: 600;
}

.splash-word-ar {
  font-family: var(--ar);
  font-size: 2.1rem;
  color: var(--forest);
  direction: rtl;
  line-height: 1.2;
}

[data-theme="dark"] .splash-word-ar { color: var(--gold); }

.splash-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--mut);
  margin-bottom: 6px;
}

.splash-bar {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 20px;
}

.splash-fill {
  height: 100%;
  width: 0%;
  background: var(--forest);
  border-radius: 99px;
  transition: width 0.1s linear;
}

/* ===== Top Navigation Bar ===== */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.top-in {
  padding: 11px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 0;
  background: none;
  padding: 0;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--ink);
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--forest);
  color: #FFFFFF;
  display: grid;
  place-items: center;
  font: 700 1.3rem/1 var(--ar);
}

.dn {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.dn button {
  border: 0;
  background: none;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--mut);
  padding: 7px 13px;
  border-radius: 99px;
  transition: all 0.15s;
}

.dn button:hover { color: var(--ink); background: var(--card-soft); }
.dn button.on { background: var(--forest); color: #FFFFFF; }

.ctl {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.dn + .ctl { margin-left: 8px; }

.tgb {
  height: 36px;
  padding: 0 13px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--card);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink);
  transition: border-color 0.15s;
}

.tgb:hover { border-color: var(--forest); }
.tgb svg { width: 16px; height: 16px; color: var(--gold); }

/* ===== Bottom Navigation Bar (Mobile App Style) ===== */
.bn {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  max-width: 960px;
  margin: 0 auto;
  display: none;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(18, 41, 35, 0.06);
}

.bn button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border: 0;
  background: none;
  padding: 7px 2px;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--mut);
  border-radius: 12px;
}

.bn button.on {
  color: var(--forest);
  font-weight: 800;
}

[data-theme="dark"] .bn button.on { color: var(--gold); }

main {
  flex: 1;
  padding: 0 0 60px;
}

.container {
  padding: 20px;
}

/* ===== Subpage Header Bar (Seperti "< Al-Quran" atau "< Hijaiyah" di Referensi) ===== */
.subbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px 6px;
}

.subbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.back-icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--card);
  display: grid;
  place-items: center;
  color: var(--ink);
}

.back-icon-btn:hover { border-color: var(--forest); }

.subbar-title h1 {
  font-size: 1.2rem;
  font-weight: 800;
}

.subbar-title small {
  display: block;
  font-size: 0.74rem;
  color: var(--mut);
}

/* ===== Banner Masjid Beranda (Sesuai Referensi Muslim App) ===== */
.mosque-hero {
  position: relative;
  background: var(--mosque-sky);
  padding: 28px 24px 58px;
  overflow: hidden;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
}

.mosque-art-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

.mosque-custom-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.42;
  pointer-events: none;
}

.mosque-hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.user-greet {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gold-soft);
  border: 2.5px solid #FFFFFF;
  color: var(--forest);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 1.25rem;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
  flex-shrink: 0;
}

.greet-text small {
  display: block;
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.92);
  font-weight: 600;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}

.greet-text h2 {
  font-size: 1.35rem;
  font-weight: 800;
  color: #FFFFFF;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
}

.greet-text span {
  display: inline-block;
  margin-top: 2px;
  font-size: 0.74rem;
  padding: 2px 9px;
  border-radius: 99px;
  background: rgba(18, 69, 56, 0.55);
  color: #FFFFFF;
  backdrop-filter: blur(4px);
}

.hero-quick-actions {
  display: flex;
  gap: 8px;
}

.glass-pill {
  border: 1px solid rgba(255, 255, 255, 0.45);
  background: rgba(18, 41, 35, 0.42);
  color: #FFFFFF;
  backdrop-filter: blur(6px);
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.glass-pill:hover { background: rgba(18, 41, 35, 0.65); }

/* ===== Perbaikan kontras banner & navigasi ===== */
.mosque-hero::after, .login-mosque-head::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10, 38, 30, 0.30) 0%, rgba(10, 38, 30, 0.66) 100%);
  z-index: 1;
  pointer-events: none;
}
.bn button.on { background: var(--card-soft); }
.tabs { scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.latihan-tabs { max-width: 660px; margin: 0 auto 16px; }
[data-theme="dark"] .kat-card:not(.forest) { background: var(--card-soft); }
[data-theme="dark"] .wc, [data-theme="dark"] .ayah-item, [data-theme="dark"] .surah-row { background: var(--card-soft); }

/* ===== Floating Mode Card (Satu-Satunya Pengatur Tingkat Kesulitan) ===== */
.floating-mode-wrap {
  padding: 0 20px;
  margin-top: -36px;
  position: relative;
  z-index: 5;
}

.floating-mode-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
  box-shadow: var(--shadow-md);
}

.mode-split {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.mode-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1.5px solid transparent;
  background: transparent;
  text-align: left;
  transition: all 0.18s ease;
}

.mode-option:hover { background: var(--card-soft); }

.mode-option.on {
  background: var(--card-soft);
  border-color: var(--forest);
}

[data-theme="dark"] .mode-option.on { border-color: var(--gold); }

.mode-icon-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--card-soft);
  color: var(--mut);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-weight: 800;
  font-size: 0.8rem;
  transition: all 0.18s ease;
}

.mode-option.on .mode-icon-badge {
  background: var(--forest);
  color: #FFFFFF;
}

.mode-option.gold-mode.on .mode-icon-badge {
  background: var(--gold);
  color: #FFFFFF;
}

.mode-meta small {
  display: block;
  font-size: 0.68rem;
  color: var(--mut);
  line-height: 1.1;
}

.mode-meta b {
  display: block;
  font-size: 0.86rem;
  color: var(--ink);
  margin-top: 2px;
}

.mode-option.gold-mode.on .mode-meta b { color: var(--gold-text); }

.mode-desc-bar {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.77rem;
  color: var(--mut);
}

/* ===== Grid 2x2 Kategori Pembelajaran (Seperti Referensi "Kategori") ===== */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 12px;
}

.sec-head h3 {
  font-size: 1.08rem;
  font-weight: 800;
}

.sec-head span {
  font-size: 0.78rem;
  color: var(--mut);
  font-weight: 600;
}

.kategori-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.kat-card {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  padding: 20px 18px;
  min-height: 162px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.kat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.kat-card.forest {
  background: var(--forest);
  border-color: var(--forest);
  color: #FFFFFF;
}

.kat-icon-box {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: rgba(18, 69, 56, 0.09);
  color: var(--forest);
  position: relative;
  z-index: 2;
}

[data-theme="dark"] .kat-icon-box {
  background: rgba(226, 181, 107, 0.14);
  color: var(--gold);
}

.kat-card.forest .kat-icon-box {
  background: #FFFFFF;
  color: var(--forest);
}

.kat-body {
  position: relative;
  z-index: 2;
  margin-top: 18px;
}

.kat-body b {
  display: block;
  font-size: 1.05rem;
  font-weight: 800;
  margin-bottom: 3px;
}

.kat-body small {
  display: block;
  font-size: 0.76rem;
  line-height: 1.35;
  opacity: 0.82;
}

.kat-mandala {
  position: absolute;
  right: -22px;
  bottom: -22px;
  width: 118px;
  height: 118px;
  pointer-events: none;
  opacity: 0.10;
  color: currentColor;
}

/* ===== Sage Gradient Banner (Seperti "Terakhir Dibaca" & "Belajar Membaca Hijaiyah") ===== */
.sage-feature-banner {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: var(--sage-banner);
  color: #FFFFFF;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 18px;
}

.sage-feature-banner .arch-badge {
  width: 54px;
  height: 64px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.16);
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.sage-banner-text small {
  display: block;
  font-size: 0.74rem;
  opacity: 0.88;
  font-weight: 600;
}

.sage-banner-text h3 {
  font-size: 1.15rem;
  font-weight: 800;
  margin: 2px 0 4px;
}

.sage-banner-text p {
  margin: 0;
  font-size: 0.8rem;
  opacity: 0.9;
}

.sage-banner-ar {
  font-family: var(--ar);
  font-size: 2.8rem;
  line-height: 1.2;

function closeSplash() {
  if (splashDone) return;
  splashDone = true;
  if (splashTimer) {
    clearInterval(splashTimer);
    splashTimer = null;
  }
  const el = document.getElementById('loading-screen');
  if (el) {
    el.style.pointerEvents = 'none';
    el.classList.add('hide');
    setTimeout(() => { el.style.display = 'none'; }, 420);
  }
}

(function initSplash() {
  const start = Date.now();
  const dur = 1800;
  const fill = document.getElementById('sp-fill');
  const pct = document.getElementById('sp-pct');
  const spAr = document.getElementById('sp-ar');
  const spId = document.getElementById('sp-id');
  const spTr = document.getElementById('sp-tr');
  let lastIdx = 0;

  splashTimer = setInterval(() => {
    const p = Math.min(100, Math.round(((Date.now() - start) / dur) * 100));
    if (fill) fill.style.width = p + '%';
    if (pct) pct.textContent = p + '%';

    const idx = Math.min(SPLASH_SAMPLES.length - 1, Math.floor((p / 100) * SPLASH_SAMPLES.length));
    if (idx !== lastIdx && spAr && spId && spTr) {
      lastIdx = idx;
      spAr.textContent = SPLASH_SAMPLES[idx].ar;
      spId.textContent = SPLASH_SAMPLES[idx].id;
      spTr.textContent = SPLASH_SAMPLES[idx].tr;
    }

    if (p >= 100) {
      clearInterval(splashTimer);
      splashTimer = null;
      setTimeout(closeSplash, 180);
    }
  }, 40);
})();

function grade(w, ok, soft) {
  if (soft) {

  e.b = ok ? Math.min(4, e.b + 1) : 0;
  e.d = dstr(INT[e.b]);
  if (e.b >= 4) masteredWords[w.ar] = 1;
  else if (!ok) delete masteredWords[w.ar];
  act(1);
}

    if (btnEl) {
      document.querySelectorAll('.snd.speaking').forEach(el => el.classList.remove('speaking'));
      btnEl.classList.add('speaking');
    }
    const u = new SpeechSynthesisUtterance(String(t || ''));
    u.lang = v ? v.lang : 'ar-SA';
    u.rate = 0.82;
    if (v) u.voice = v;
    u.onend = () => { if (btnEl) btnEl.classList.remove('speaking'); };
    u.onerror = () => { if (btnEl) btnEl.classList.remove('speaking'); };
    setTimeout(() => speechSynthesis.speak(u), 50);
  } catch (e) {
    if (btnEl) btnEl.classList.remove('speaking');
    toast('Fitur suara tidak didukung di peramban ini. Gunakan Chrome atau Safari.');
  }
};

function applyTheme(t, animate = false) {
  const mode = t === 'dark' ? 'dark' : 'light';
  const overlay = document.getElementById('sky-overlay');
  const disc = document.getElementById('sky-disc');
  const title = document.getElementById('sky-title');
  const sub = document.getElementById('sky-sub');

  if (animate && overlay && disc && title && sub) {
    if (skyTimer) clearTimeout(skyTimer);
    overlay.classList.remove('to-dark', 'to-light', 'active');
    disc.style.animation = 'none';
    void overlay.offsetWidth;
    void disc.offsetWidth;
    disc.style.animation = '';

    overlay.classList.add(mode === 'dark' ? 'to-dark' : 'to-light', 'active');
    disc.innerHTML = mode === 'dark' ? IC.moon : IC.sun;
    title.textContent = mode === 'dark' ? 'Mode Malam' : 'Mode Siang';
    sub.textContent = mode === 'dark' ? 'لَيْلَةٌ هَادِئَةٌ' : 'نَهَارٌ سَعِيدٌ';

    setTimeout(() => {
      document.documentElement.dataset.theme = mode;
      $('#tg').innerHTML = `${mode === 'dark' ? IC.moon : IC.sun}<span>${mode === 'dark' ? 'Malam' : 'Siang'}</span>`;
    }, 140);

    skyTimer = setTimeout(() => {
      overlay.classList.remove('active', 'to-dark', 'to-light');
    }, 700);
  } else {
    document.documentElement.dataset.theme = mode;
    $('#tg').innerHTML = `${mode === 'dark' ? IC.moon : IC.sun}<span>${mode === 'dark' ? 'Malam' : 'Siang'}</span>`;
  }
}

}

function mg() {
  const el = $('#mg');
  if (!el) return;
  const q = searchQuery;
  const f = W.filter(w =>
    (q ? (w.id.toLowerCase().includes(q) || w.tr.toLowerCase().includes(q) || w.ar.includes(q) || stripHarakat(w.ar).includes(q)) : w.t === tema) &&
    (flt === 'all' || (flt === 'done') === !!masteredWords[w.ar])
  );
  $('#mc').textContent = q ? `${f.length} hasil pencarian untuk “${q}”` : `Tema ${tema} · ${f.length} Kosakata`;

  if (!f.length) {
    el.className = '';
    el.innerHTML = `<div class="card c"><p class="mut">Tidak ada kosakata yang cocok dengan filter pencarian.</p></div>`;
    return;
  }

  if (viewMode === 'list') {
    el.className = 'ayah-list';
    el.innerHTML = f.map((w, idx) => renderAyahRow(w, idx + 1)).join('');
  } else {
    el.className = 'hijaiyah-grid';
    el.innerHTML = f.map(renderGridCard).join('');
  }
}

V.kalimat = () => {
  const info = diff === 'mudah'
    ? 'Menyusun kalimat 2 kata dengan teks Arab berharakat lengkap.'
    : diff === 'sedang'
    ? 'Menyusun kalimat 2–3 kata (termasuk kata sifat & kata tanya) berharakat.'
    : 'Menyusun kalimat 3 kata Arab gundul ditambah 2 kata pengecoh.';

  R(`
    <div class="container">
      ${renderGameTabs('kalimat')}
      <div class="sage-feature-banner" style="max-width:650px;margin:0 auto 18px">
        <div style="display:flex;align-items:center;gap:14px">
          <div class="arch-badge">${ARCH_DOOR_SVG}</div>
          <div class="sage-banner-text">
            <small>${DIFF[diff].full}</small>
            <h3>Latihan Merangkai Kalimat Bahasa Arab</h3>
            <p>${info}</p>
          </div>
        </div>
      </div>

      <div class="card c" style="max-width:650px;margin:0 auto">
        <h3 style="margin:4px 0 8px">Pilih Paket Jumlah Soal</h3>
        <p class="mut" style="margin:0 auto 20px;max-width:450px">Susun kata demi kata dari kanan ke kiri sesuai kaidah Bahasa Arab.</p>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <button type="button" class="btn alt" onclick="ks(20)">20 Soal</button>
          <button type="button" class="btn" onclick="ks(50)">50 Soal</button>
          <button type="button" class="btn alt" onclick="ks(100)">100 Soal</button>
        </div>
      </div>
    </div>
  `);
};

function ks(n) {
  let pool;
  if (diff === 'mudah') {
    pool = S.filter(s => s[0].length === 2);
  } else if (diff === 'sedang') {
    const s3 = sh(S.filter(s => s[0].length === 3));
    const s2 = sh(S.filter(s => s[0].length === 2));
    pool = [];
    const maxLen = Math.max(s3.length, s2.length);
    for (let idx = 0; idx < maxLen; idx++) {
      if (idx < s3.length) pool.push(s3[idx]);
      if (idx < s2.length) pool.push(s2[idx]);
    }
  } else {
    pool = S.filter(s => s[0].length === 3);
  }
  K = { q: sh(pool).slice(0, n), i: 0, sc: 0 };
  kq();
}

function kq() {
  if (K.i >= K.q.length) {
    R(`
      <div class="container">
        <div class="card c" style="max-width:540px;margin:0 auto">
          <h2>Latihan Kalimat Selesai</h2>
          <div class="score">${K.sc} / ${K.q.length}</div>
          <p class="mut">Kalimat berhasil disusun dengan benar pada <b>${DIFF[diff].full}</b>.</p>
          <div class="row" style="margin-top:18px">
            <button type="button" class="btn" onclick="V.kalimat()">Ulangi Latihan</button>
            <button type="button" class="btn alt" onclick="goHome()">Ke Beranda</button>
          </div>
        </div>
      </div>
    `);
    return;
  }

  const targetWords = K.q[K.i][0];
  let rawTiles = targetWords.map((x, j) => ({ x, origIdx: j, dist: false }));

  if (diff === 'sulit') {
    const distractors = sh(
      W.filter(w => w.g && !targetWords.includes(w.ar)).map(w => w.ar)
    ).slice(0, 2);
    distractors.forEach((dx, idx) => {
      rawTiles.push({ x: dx, origIdx: targetWords.length + idx, dist: true });
    });
  }

  K.t = sh(rawTiles).map((tile, idx) => ({
    id: idx,
    x: tile.x,
    used: false
  }));
  K.a = [];
  K.ck = false;
  K.peek = false;
  kd();
}

function toggleKalimatPeek() {
  if (!K) return;
  K.peek = !K.peek;
  kd();
}

function kd() {
  const [w, id] = K.q[K.i];
  const bank = K.t.filter(t => !t.used);
  const peekBtn = diff === 'sulit'
    ? `<button type="button" class="peek-btn" onclick="toggleKalimatPeek()">${IC.eye} <span>${K.peek ? 'Sembunyikan Harakat' : 'Intip Harakat'}</span></button>`
    : '';
  const grammarExplanation = EX[w[0]] || 'Kalimat Bahasa Arab disusun secara berurutan dari kanan ke kiri.';

  R(`
    <div class="container">
      <div class="card" style="max-width:650px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="mut" style="font-weight:700;font-size:.83rem">Soal ${K.i + 1} / ${K.q.length} · Benar: ${K.sc}</span>
          <div style="display:flex;gap:8px;align-items:center">
            ${peekBtn}
            <button type="button" class="btn sm alt" onclick="V.kalimat()">Ganti Paket</button>
          </div>
        </div>
        <div class="bar"><i style="width:${(K.i / K.q.length) * 100}%"></i></div>
        <p style="font-size:1rem;margin-bottom:12px">Susun kata Bahasa Arab (dari kanan ke kiri) untuk arti: <b>“${esc(id)}”</b></p>

        <div class="zone ${K.a.length ? 'active-zone' : ''}">
          ${K.a.length
            ? K.a.map((t, k) => `<button type="button" class="tl" onclick="kx(${k})">${fmtAr(t.x, K.peek)}</button>`).join('')
            : `<span class="mut" style="font-size:.8rem;direction:ltr">Ketuk kata di bawah untuk menyusun kalimat di sini...</span>`
          }
        </div>

        <div class="zone" style="border-style:solid;background:var(--bg-app)">
          ${bank.map(t => `<button type="button" class="tl" onclick="kp(${t.id})">${fmtAr(t.x, K.peek)}</button>`).join('')}
        </div>

        ${K.ck
          ? `<div class="msg ${K.ok ? 'ok' : 'bad'}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
                <div>
                  <b>${K.ok ? 'Jawaban Benar.' : 'Belum Tepat.'}</b> Kalimat yang benar:
                  <span class="ar" style="font-size:1.5rem;margin:0 8px">${w.join(' ')}</span> = “${esc(id)}”
                </div>
                <button type="button" class="snd" onclick="sayCurrentSentence(this)" aria-label="Dengarkan">${IC.speaker}</button>
              </div>
              <small style="display:block;margin-top:6px;opacity:.88">${esc(grammarExplanation)}</small>
            </div>
            <button type="button" class="btn full" onclick="K.i++;kq()"><span>Selanjutnya</span> ${IC.arrowRight}</button>`
          : `<button type="button" class="btn full" onclick="kc()" ${K.a.length < w.length ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>Periksa Jawaban</button>`
        }
      </div>
    </div>
  `);
}

function kp(tokenId) {
  if (!K || K.ck) return;
  const token = K.t.find(t => t.id === tokenId);
  if (!token || token.used) return;
  token.used = true;
  K.a.push(token);
  kd();
}

function kx(ansIdx) {
  if (!K || K.ck) return;
  const removed = K.a[ansIdx];
  if (!removed) return;
  removed.used = false;
  K.a.splice(ansIdx, 1);
  kd();
}

function kc() {
  if (!K || K.ck) return;
  const w = K.q[K.i][0];
  K.ok = K.a.length === w.length && K.a.every((t, idx) => t.x === w[idx]);
  if (K.ok) K.sc++;
  act();
  K.ck = true;
  kd();
}

V.memory = () => {
  clearMemoryTimer();
  cur = 'memory';
  updateNavbarState();

  M = {
    pairs,

      { k: w.idx, a: 0, t: w.t, id: w.id, u: false, d: false }
    ])),
    o: [],
    m: 0,
    l: false
  };
  md();
};

function md() {
  const win = M.c.every(c => c.d);
  const backIcon = `<svg viewBox="0 0 40 40" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"><rect x="8" y="8" width="24" height="24" rx="2"/><rect x="8" y="8" width="24" height="24" rx="2" transform="rotate(45 20 20)"/></svg>`;

  R(`
    <div class="container">
      ${renderGameTabs('memory')}
      <div class="card" style="max-width:660px;margin:0 auto">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <span class="mut" style="font-weight:700;font-size:.84rem">Langkah: <b>${M.m}</b> · Temukan ${M.pairs} Pasangan Kartu</span>
          <button type="button" class="btn sm alt" onclick="V.memory()">Acak Ulang</button>
        </div>
        ${win ? `<div class="msg ok c"><b>Selesai!</b> Seluruh pasangan kartu ditemukan dalam ${M.m} langkah.</div><button type="button" class="btn full" style="margin-bottom:16px" onclick="V.memory()">Main Lagi</button>` : ''}
        <div class="mem">
          ${M.c.map((c, i) => {
            const face = c.a
              ? `<span class="ar">${fmtAr(c.ar)}</span>`
              : `<span class="mc-cat">${esc(c.t)}</span><span class="mc-id">${esc(c.id)}</span>`;
            return `<button type="button" class="mc ${c.u ? 'u' : ''} ${c.d ? 'd' : ''}" onclick="mf(${i})">${c.u || c.d ? face : backIcon}</button>`;
          }).join('')}
        </div>
      </div>
    </div>
  `);
}

function mf(i) {
  if (!M || M.l) return;
  const c = M.c[i];
  if (!c || c.u || c.d) return;
  c.u = true;
  M.o.push(i);
  if (c.a) sayI(c.k);

  if (M.o.length === 2) {
    M.m++;
    const [a, b] = M.o.map(j => M.c[j]);
    if (a.k === b.k) {
      a.d = b.d = true;
      a.u = b.u = false;
      M.o = [];
      md();
    } else {
      M.l = true;
      md();
      clearMemoryTimer();
      memTimer = setTimeout(() => {
        if (!M || cur !== 'memory') return;
        a.u = b.u = false;
        M.o = [];
        M.l = false;
        md();
      }, 780);
    }
    return;
  }
  md();
}

V.cocok = () => {
  clearMemoryTimer();
  cur = 'cocok';

function cd() {
  const win = C.d.length === C.pairs;

  R(`

        <div class="mrow">
          <div>
            ${C.ws.map((w, i) => `<button type="button" class="mb ${C.d.includes(w.idx) ? 'ok' : C.l === i ? 'sel' : ''}" onclick="cl(${i})"><span class="ar" style="font-size:1.65rem;margin:0">${fmtAr(w.ar)}</span></button>`).join('')}
          </div>
          <div>
            ${C.r.map((w, j) => `<button type="button" class="mb ${C.d.includes(w.idx) ? 'ok' : ''}" onclick="cr(${j})"><span class="mut" style="font-size:.66rem;text-transform:uppercase;display:block">${esc(w.t)}</span><span style="font-size:.92rem;font-weight:700">${esc(w.id)}</span></button>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `);
}

function cl(i) {
  if (!C || !C.ws[i] || C.d.includes(C.ws[i].idx)) return;
  C.l = i;
  sayI(C.ws[i].idx);
  cd();
}

function cr(j) {
  if (!C || C.l === null || !C.r[j] || C.d.includes(C.r[j].idx)) return;
  const leftWord = C.ws[C.l];
  const rightWord = C.r[j];
  if (rightWord.idx === leftWord.idx) {
    C.d.push(leftWord.idx);
  } else {
    C.x++;
  }
  C.l = null;
  cd();
}

function startQuiz(n) {
  Q = {
    q: sh(P.flatMap(w => [0, 1, 2].map(t => ({ w, t })))).slice(0, n),
    i: 0,
    s: 0,
    wr: [],
    diffAtStart: diff
  };
  qn();
}

function startQuizCountdown() {
  clearQuizTimer();
  const limit = diff === 'sedang' ? 20 : diff === 'sulit' ? 12 : 0;
  Q.limit = limit;
  Q.tl = limit;
  if (!limit) return;

  quizTimer = setInterval(() => {
    if (cur !== 'kuis' || !Q || Q.a) {
      clearQuizTimer();
      return;
    }
    Q.tl--;
    const badge = $('#q-timer');
    if (badge) {
      badge.innerHTML = `${IC.clock} <span>${Q.tl}s</span>`;
      if (Q.tl <= 5) badge.classList.add('urgent');
    }
    if (Q.tl <= 0) {
      clearQuizTimer();
      qa(-1, true);
    }
  }, 1000);
}

function qn() {
  clearQuizTimer();
  if (Q.i >= Q.q.length) {
    lastScore = Math.round((Q.s / Q.q.length) * 100);
    st.lastScore = lastScore;
    st.best = Math.max(st.best || 0, lastScore);
    save();
    go('skor', true);
    return;
  }
  if (Q.q[Q.i].t == 2 && !hasV()) Q.q[Q.i].t = 0;
  const w = Q.q[Q.i].w;
  Q.o = sh([w, ...sh(P.filter(x => x.idx !== w.idx)).slice(0, 3)]);
  Q.a = false;
  Q.p = -1;
  Q.timeout = false;
  Q.peek = false;
  startQuizCountdown();
  qd();
  if (Q.q[Q.i].t == 2) sayI(w.idx);
}

function toggleQuizPeek() {
  if (!Q) return;
  Q.peek = !Q.peek;
  qd();
}

function qd() {
  const { w, t } = Q.q[Q.i];
  const arPrompt = fmtAr(w.ar, Q.peek);

  const promptHtml = t == 0
    ? `<div class="ar big" style="margin:6px 0">${arPrompt}</div><div class="mut" style="font-size:.82rem">Tema: ${esc(w.t)}</div>`
    : t == 1
    ? `<h2 style="font-size:1.75rem;font-weight:800;margin:8px 0">${esc(w.id)}</h2><div class="mut" style="font-size:.82rem">Tema: ${esc(w.t)}</div>`
    : `<div style="margin:12px 0"><button type="button" class="btn sm" onclick="sayQuizPrompt(this)">${IC.speaker} <span>Putar Suara Arab</span></button></div>`;

  const timerHtml = Q.limit
    ? `<span id="q-timer" class="timer-badge ${Q.tl <= 5 ? 'urgent' : ''}">${IC.clock} <span>${Q.tl}s</span></span>`
    : '';

  const peekBtn = (diff === 'sulit' && t !== 2)
    ? `<button type="button" class="peek-btn" onclick="toggleQuizPeek()">${IC.eye} <span>${Q.peek ? 'Sembunyikan Harakat' : 'Intip Harakat'}</span></button>`
    : '';

  const isChosenCorrect = Q.p >= 0 && Q.o[Q.p] && Q.o[Q.p].idx === w.idx;

  $('#app').innerHTML = `
    <div class="container view-enter" style="max-width:580px;margin:0 auto">
      <div class="card" style="padding:22px 20px">
        <!-- Bilah Atas Kuis (Tombol X, Progress Bar, Nomor Soal seperti Referensi) -->
        <div class="quiz-topbar">
          <button type="button" class="quiz-close-btn" onclick="goHome()" aria-label="Tutup kuis">${IC.close}</button>
          <div class="quiz-progress-track">
            <div class="quiz-progress-fill" style="width:${((Q.i + 1) / Q.q.length) * 100}%"></div>
          </div>
          ${timerHtml}
          <span class="quiz-counter">${Q.i + 1}/${Q.q.length}</span>
        </div>

        <div class="c" style="margin:12px 0 18px">
          <p class="mut" style="font-size:.88rem;font-weight:600;margin-bottom:4px">Pilih Jawaban yang Benar</p>
          ${peekBtn}
          ${promptHtml}
        </div>

        <!-- Grid 2x2 Kartu Pilihan Jawaban (Mengikuti Layar Kuis Referensi) -->
        <div class="quiz-Grid2x2">
          ${Q.o.map((o, k) => {
            const cls = Q.a ? (o.idx === w.idx ? 'ok' : k === Q.p ? 'bad' : '') : '';
            const content = t == 1
              ? `<span class="ar">${fmtAr(o.ar, Q.peek)}</span>`
              : `<span class="opt-text">${esc(o.id)}</span>`;
            return `<button type="button" class="quiz-card-opt c${k % 4} ${cls}" onclick="qa(${k})">${content}</button>`;
          }).join('')}
        </div>

        ${Q.a ? `
          <div class="msg ${isChosenCorrect ? 'ok' : 'bad'}" style="margin-bottom:12px">
            ${Q.timeout ? 'Waktu habis! Jawaban yang benar:' : isChosenCorrect ? 'Jawaban Benar!' : 'Kurang tepat. Jawaban yang benar:'}
            <span class="ar" style="font-size:1.45rem;margin:0 6px">${w.ar}</span> (${esc(w.tr)}) = <b>${esc(w.id)}</b>
          </div>
        ` : ''}

        <button type="button" class="btn full" onclick="${Q.a ? 'Q.i++;qn()' : ''}" ${!Q.a ? 'disabled style="opacity:.45;cursor:not-allowed"' : ''}>
          <span>${Q.i == Q.q.length - 1 ? 'Lihat Hasil Evaluasi' : 'Selanjutnya'}</span>
        </button>
      </div>
    </div>
  `;
}

function qa(k, isTimeout = false) {
  if (!Q || Q.a) return;
  clearQuizTimer();
  Q.a = true;
  Q.p = k;
  Q.timeout = isTimeout;
  const w = Q.q[Q.i].w;
  const okA = !isTimeout && Q.o[k] && Q.o[k].idx === w.idx;
  if (okA) Q.s++;
  else Q.wr.push(w);
  grade(w, okA, true);
  qd();
}

V.skor = () => {
  clearQuizTimer();
  if (!Q || Q.i < Q.q.length) {
    R(`
      <div class="container">
        <div class="card c" style="max-width:520px;margin:0 auto">
          <div style="color:var(--forest);margin-bottom:8px">${IC.award}</div>
          <h2>Belum Ada Rapor Evaluasi</h2>
          <p class="mut">Selesaikan kuis terlebih dahulu untuk melihat nilai dan daftar kosakata yang perlu diulang.</p>
          <button type="button" class="btn" onclick="go('kuis')">Mulai Kuis</button>
        </div>
      </div>
    `);
    return;
  }
  const n = Math.round((Q.s / Q.q.length) * 100);
  const cat = n >= 85 ? 'Sangat Baik (Mumtaz)' : n >= 60 ? 'Baik (Jayyid)' : 'Perlu Belajar Lagi';
  const stCount = n >= 85 ? 3 : n >= 60 ? 2 : 1;
  const wr = [...new Set(Q.wr)];
  const usedDiff = DIFF[Q.diffAtStart || diff];
  const starsSvg = [1, 2, 3].map(idx => idx <= stCount ? IC.star : IC.starMuted).join('');

  R(`
    <div class="container">
      <div class="card c" style="max-width:600px;margin:0 auto 18px">
        <span class="badge-clean">${usedDiff.full}</span>
        <h2 style="margin:10px 0 6px">Hasil Evaluasi ${esc(st.name)}</h2>
        <div style="display:flex;justify-content:center;gap:6px;margin:8px 0">${starsSvg}</div>
        <div class="score">${n}</div>
        <p style="margin:4px 0"><b>${cat}</b> · Benar ${Q.s} dari ${Q.q.length} soal</p>
        <p class="mut" style="font-size:.86rem">${n >= 85 ? 'Masya Allah, penguasaan kosakata Bahasa Arab Anda sangat baik.' : n >= 60 ? 'Hasil yang baik! Pelajari kembali beberapa kosakata yang masih keliru di bawah ini.' : 'Jangan menyerah, pelajari kembali materi kosakata di bawah ini lalu coba lagi.'}</p>
        <div class="row" style="margin-top:18px">
          <button type="button" class="btn" onclick="go('kuis')">Ulangi Kuis</button>
          ${wr.length ? `<button type="button" class="btn alt" onclick="go('review')">Ulas Kata yang Salah</button>` : ''}
          <button type="button" class="btn alt" onclick="goHome()">Kembali ke Beranda</button>
        </div>
      </div>

      ${wr.length ? `
        <div class="card" style="max-width:600px;margin:0 auto">
          <h3 style="margin-bottom:10px">Perlu Diulang (${wr.length} Kosakata)</h3>
          ${wr.map(w => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft)">
              <div>
                <span class="ar" style="font-size:1.45rem;margin-right:10px">${w.ar}</span>
                <span class="tr">(${esc(w.tr)})</span>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <strong>${esc(w.id)}</strong>
                <button type="button" class="snd" onclick="sayI(${w.idx}, this)" aria-label="Dengarkan">${IC.speaker}</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `);
};

/* =========================================================
   13. INISIALISASI APLIKASI
   ========================================================= */
$('#dn').innerHTML = NAV.map(n => `<button type="button" data-v="${n[0]}" onclick="${n[0] === 'home' ? 'goHome()' : `go('${n[3]}')`}">${n[1]}</button>`).join('');
$('#bn').innerHTML = NAV.map(n => `<button type="button" data-v="${n[0]}" onclick="${n[0] === 'home' ? 'goHome()' : `go('${n[3]}')`}">${n[2]}<span>${n[1]}</span></button>`).join('');
applyTheme(st.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);
go('home', true);
</script>
</body>
